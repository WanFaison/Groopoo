<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creer Projet</title>
</head>
<app-header></app-header>
<app-header1></app-header1>

<body>
    <!-- les boutons -->
    <h1 class="text-center text-3xl font-bold text-gray-900 mb-2">Créer un Projet</h1>

    <div class="container w-75 border rounded p-4 mb-3">
        <div class="d-flex justify-content-center text-center border-bottom">
            <p class="me-3"><span class="bg-warning rounded-circle p-2">2</span> Paramètre</p><i
                class="bi bi-chevron-right"></i>
            <p class="ms-4"><span class="bg-light rounded-circle p-2">3</span> Advancé</p>
        </div>
        <div class="form-container">
            <form id="formProjet">
                <div class="mt-5 mb-3">
                    <label for="nomProjet" class="form-label label-flex">
                        Nom du projet
                        <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                    </label>

                    <input type="text" class="form-control" id="nomProjet" placeholder="Ex: GRAND PROJET 2025">
                </div>

                <!-- Option de création -->
                <div class="mb-3">
                    <select class="form-select" id="optionCreation" (click)="afficherSection()">
                        <option selected disabled>Choisir une option</option>
                    </select>
                </div>
                <div *ngIf="afficherInputs" class="mt-3">
                    <div class="mb-3">
                        <input type="number" class="form-control" id="nbGroupes" placeholder="Ex: 5">
                    </div>

                    <div class="mb-3">
                        <input type="number" class="form-control" id="nbMembres" placeholder="Ex: 4">
                    </div>
                </div>
                <!-- Section période + organisation -->
                <div id="periodeSection " class="hidden d-flex">
                    <div class="mb-3 w-75 me-2">
                        <select class="form-select" id="organisation">
                            <option>Year</option>
                            <option>2019</option>
                            <option>2023 </option>
                            <option>2025 </option>
                        </select>
                    </div>
                    <div class="mb-3 w-75">
                        <select class="form-select" id="organisation">
                            <option>Sélectionner une organisation</option>
                            <option>Organisation A</option>
                            <option>Organisation B</option>
                            <option>Organisation C</option>
                        </select>
                    </div>
                </div>

                <div class="rondel-select mt-3 d-flex gap-3 justify-content-between">
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1 ">
                            <label class="form-check-label" for="radioDefault1">
                                Groupe par classe
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                            <label class="form-check-label" for="radioDefault2">
                                Groupes aléatoires
                            </label>
                        </div>
                    </div>
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                            <label class="form-check-label" for="radioDefault1">
                                Groupe par sexe
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                            <label class="form-check-label" for="radioDefault2">
                                Définir critère par groupe
                            </label>
                        </div>
                    </div>
                </div>
                <!-- Bouton suivant -->
                <div class="d-flex justify-content-center mt-3">
                    <button type="button" class="btn btn-lg text-white" style="background-color: #F09D13;">
                        Suivant
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
<app-footer></app-footer>
